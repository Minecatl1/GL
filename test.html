<!DOCTYPE html>
<html>
<head>
  <title>Universal Game Loader</title>
  <style>
    .game-item { cursor: pointer; padding: 10px; }
    .game-frame { width: 100%; height: 80vh; border: none; }
    #emulator-canvas { width: 100%; max-width: 640px; }
  </style>
</head>
<body>
  <header>
    <button id="toggle-html5">Toggle HTML5 Mode</button>
    <span id="mode-indicator"></span>
  </header>

  <aside id="game-menu"><!-- Game list renders here --></aside>
  
  <main id="game-container"><!-- Active game renders here --></main>

  <script src="Loader.js"></script>
</body>
</html>
