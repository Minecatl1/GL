<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Loader with EmulatorJS</title>
    <script src="./emulators/emulatorJS/emulatorJS1.js"></script> <!-- Local EmulatorJS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #282c34;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .container {
            background-color: #3c4043;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            width: 350px;
            text-align: center;
            margin-bottom: 20px;
        }
        h2 {
            margin: 0 0 20px;
            color: #61dafb;
        }
        .game-list {
            list-style: none;
            padding: 0;
            max-height: 300px;
            overflow-y: auto;
            margin: 0;
        }
        .game-item {
            margin: 10px 0;
            cursor: pointer;
            padding: 10px;
            border: 1px solid #61dafb;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .game-item:hover {
            background-color: #61dafb;
            color: #282c34;
        }
        .game-icon {
            width: 50px;
            height: 50px;
            margin-right: 10px;
            vertical-align: middle;
            border-radius: 5px;
            border: 1px solid #3c4043;
        }
        #emuContainer {
            width: 80%;
            height: 60vh;
            margin-top: 20px;
            position: relative;
            background-color: black;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Game Loader</h2>
        <ul class="game-list" id="gameList">
            <!-- Games will be dynamically added here -->
        </ul>
    </div>
    <div id="emuContainer">
        <div id="game"></div> <!-- EmulatorJS will use this div -->
    </div>
    <script>
        fetch('game_list.json')
            .then(response => response.json())
            .then(games => {
                const gameList = document.getElementById('gameList');
                const emuContainer = document.getElementById('game');
                games.forEach(game => {
                    const listItem = document.createElement('li');
                    listItem.className = 'game-item';

                    if (game.icon) {
                        const icon = document.createElement('img');
                        icon.src = game.icon;
                        icon.alt = `${game.name} icon`;
                        icon.className = 'game-icon';
                        listItem.appendChild(icon);
                    }

                    const text = document.createTextNode(game.name);
                    listItem.appendChild(text);

                    listItem.addEventListener('click', () => {
                        if (game.type === 'nes' || game.type === 'snes' || game.type === 'gba' || game.type === 'gb') {
                            // Start EmulatorJS to play the ROM
                            EmulatorJS.start({
                                div: emuContainer,
                                gameUrl: game.path, // Path to the ROM file
                                biosUrl: '', // Optional: Path to BIOS file (if needed for certain emulators)
                                core: game.type // Match the core to the game type (e.g., nes, snes, gba, gb)
                            });
                        } else {
                            console.log('Unsupported ROM type:', game.type);
                        }
                    });

                    gameList.appendChild(listItem);
                });
            })
            .catch(error => console.error('Error fetching game list:', error));
    </script>
</body>
</html>
